services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_REPO_URL: ${NEXT_PUBLIC_REPO_URL:-}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - api
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      App__Origin: http://localhost:8080
      ConnectionStrings__Postgres: Host=db;Database=cratepending;Username=cratepending;Password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      Google__ClientId: ${GOOGLE_CLIENT_ID:-}
      Google__ClientSecret: ${GOOGLE_CLIENT_SECRET:-}
      Ai__CloudflareAccountId: ${CLOUDFLARE_ACCOUNT_ID:-}
      Ai__CloudflareToken: ${CLOUDFLARE_AI_TOKEN:-}
      Ai__Mock: ${AI_MOCK:-false}
      MusicBrainz__Contact: ${MUSICBRAINZ_CONTACT:-}
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cratepending
      POSTGRES_USER: cratepending
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cratepending"]
      interval: 5s
      timeout: 3s
      retries: 15
volumes:
  postgres:
